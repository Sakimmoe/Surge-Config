# Surge 主配置（Sukka Ruleset · 简单分流版）
# 规则组来源: https://github.com/SukkaW/Surge
# 规则组文档: https://github.com/SukkaW/Surge#readme
# 规则组服务器: https://ruleset.skk.moe
#
# 分流原则: 国外网站走代理，国内网站走直连
# 使用前:
#   在 [Proxy] 填入你的节点；或直接在 Surge App 内添加订阅，再把生成的节点粘贴到这里
#
# 顺序说明: 所有 DOMAIN-SET / RULE-SET 非 IP 规则必须位于 IP 规则之前，
# 否则会失去 Sukka Ruleset 提供的 DNS 污染保护。

[General]
# 以下参数完全来自 SukkaW/Surge 仓库:
# - Modules/sukka_surge_network_test_domain.sgmodule
# - Build/build-sgmodule-always-realip.ts 生成的 sukka_common_always_realip.sgmodule
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://latency-test.skk.moe/endpoint
always-real-ip = dns.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.turn.twilio.com, *.stun.twilio.com, stun.syncthing.net, stun.*, lancache.steamcontent.com

[Proxy]
# 示例: 节点名称 = ss, 服务器地址, 端口, encrypt-method=aes-128-gcm, password=密码

[Proxy Group]
ᴘʀᴏxʏ = select, no-alert=0, hidden=0, include-all-proxies=1, icon-url=B1::Plants::Sunflower

[Rule]
# ===== 广告拦截 / 隐私保护（Non-IP，必须置于最前）=====
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP,pre-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT-NO-DROP,extended-matching

# ===== 国内直连（Non-IP）=====
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/apple_cdn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT

# ===== 国外走代理（Non-IP）=====
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/cdn.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_us.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_eu.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_jp.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_kr.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_hk.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_tw.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_intelligence.conf,ᴘʀᴏxʏ,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft.conf,ᴘʀᴏxʏ
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/download.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/non_ip/download.conf,ᴘʀᴏxʏ

# ===== 其他 =====
DOMAIN,gdmf.apple.com,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,ᴘʀᴏxʏ

# ===== IP 规则（必须全部位于非 IP 规则之后）=====
RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT-DROP
RULE-SET,https://ruleset.skk.moe/List/ip/stream_us.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/stream_eu.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/stream_jp.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/stream_kr.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/stream_hk.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/stream_tw.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/stream.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/ai.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,ᴘʀᴏxʏ
RULE-SET,https://ruleset.skk.moe/List/ip/lan.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/domestic.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT
# 使用 IPv6 时取消注释
# RULE-SET,https://ruleset.skk.moe/List/ip/china_ip_ipv6.conf,DIRECT

# ===== 兜底：其余一律走代理 =====
FINAL,ᴘʀᴏxʏ,dns-failed
